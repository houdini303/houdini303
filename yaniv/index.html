  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0d1117; color: #e6edf3;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto;
  }
  h1 { font-size: 22px; text-align: center; margin: 8px 0 16px; letter-spacing: 2px; }
  h1 span { color: #58a6ff; }

  .player {
    display: flex; align-items: center; gap: 8px;
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .player.out { opacity: .45; }
  .player .name { flex: 1; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .player .total { font-size: 20px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .player .total.warn { color: #f0883e; }
  .player .total.dead { color: #f85149; }
  .player input {
    width: 58px; font-size: 17px; text-align: center;
    background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 8px; padding: 9px 2px;
  }
  .player .outLabel { font-size: 12px; font-weight: 700; color: #f85149; letter-spacing: 1px; }

  .chip {
    font-size: 12px; font-weight: 700; letter-spacing: .5px;
    padding: 8px 9px; width: auto; margin: 0; border-radius: 8px;
    background: #21262d; color: #8b949e; border: 1px solid #30363d;
  }
  .chip.chipY.on { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .chip.chipA.on { background: #8957e5; color: #fff; border-color: #8957e5; }

  button {
    font-size: 17px; font-weight: 700; border: none; border-radius: 12px;
    padding: 14px; width: 100%; margin-top: 8px; cursor: pointer; color: #fff;
  }
  .primary { background: #238636; }
  .secondary { background: #21262d; color: #c9d1d9; font-weight: 500; font-size: 15px; padding: 12px; }
  .row { display: flex; gap: 8px; }
  .row button { margin-top: 8px; }
  button:disabled { opacity: .4; }

  #addForm { display: flex; gap: 8px; margin-bottom: 8px; }
  #addForm input {
    flex: 1; font-size: 17px; background: #161b22; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 12px; padding: 12px;
  }
  #addForm button { width: auto; margin: 0; padding: 12px 18px; background: #1f6feb; }

  .hint { text-align: center; color: #8b949e; font-size: 13px; margin: 12px 0; }
  #msg { text-align: center; color: #f0883e; font-size: 13px; margin: 8px 0; min-height: 16px; }

  .limitRow {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 12px; color: #8b949e; font-size: 13px;
  }
  .limitRow input {
    width: 64px; font-size: 15px; text-align: center;
    background: #161b22; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 8px; padding: 7px 2px;
  }
  .limitRow input:disabled { opacity: .45; }
  .limitNote { font-size: 11px; }

  /* ---------- historie: tabulka kol ---------- */
  #historyBox { margin-top: 18px; }
  #historyBox h2 { font-size: 14px; color: #8b949e; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .tableWrap { overflow-x: auto; border: 1px solid #30363d; border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; min-width: 100%; }
  th, td {
    padding: 8px 10px; text-align: center; font-size: 14px;
    border-bottom: 1px solid #21262d; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  thead th { background: #161b22; font-size: 13px; color: #c9d1d9; position: sticky; top: 0; }
  th:first-child, td:first-child { color: #8b949e; font-size: 12px; }
  tfoot td { background: #161b22; font-weight: 800; font-size: 15px; border-bottom: none; }
  tfoot td.dead { color: #f85149; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .5px;
    border-radius: 5px; padding: 1px 4px; margin-left: 4px; vertical-align: 1px;
  }
  .badge.y { background: #1f6feb; color: #fff; }
  .badge.yx { background: #f85149; color: #fff; }
  .badge.a { background: #8957e5; color: #fff; }
  .slash { display: block; font-size: 10px; color: #3fb950; }

  /* ---------- BUSTED overlay (GTA San Andreas style) ---------- */
  #busted {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,.88);
  }
  #busted.show { display: flex; }
  body.grayscale #app { filter: grayscale(1) brightness(.6); transition: filter .4s; }

  #chase {
    width: min(96vw, 460px); height: 200px;
    border-radius: 12px;
    image-rendering: pixelated;
  }

  #bustedWord {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 0 .4em; row-gap: 0; padding: 0 8px; margin-top: 2vh;
  }
  #bustedWord .word { display: flex; }
  #bustedWord .l {
    font-family: 'Pirata One', Georgia, serif;
    font-size: min(13vw, 64px); font-weight: 400; letter-spacing: 2px;
    background: linear-gradient(#cfe3ff 0%, #7fb2ff 45%, #1e5bbf 55%, #0a2f6b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1.5px #061a3a;
    opacity: 0; transform: scale(3);
  }
  #bustedWord .l.stamp { animation: stamp .18s ease-out forwards; }
  @keyframes stamp {
    from { opacity: 0; transform: scale(3); }
    to   { opacity: 1; transform: scale(1); }
  }
  #bustedWho { margin-top: 3vh; font-size: 20px; font-weight: 700; color: #fff; text-align: center; padding: 0 20px; }
  #bustedClose { margin-top: 4vh; width: auto; padding: 12px 32px; background: #21262d; color: #c9d1d9; }
  #coffee {
    margin-top: 20px; padding: 10px 22px; border-radius: 12px;
    background: #ffdd00; color: #0d0c22; font-weight: 700; font-size: 15px;
    text-decoration: none;
  }
  #coffeeQr {
    margin-top: 12px; width: 104px; height: 104px;
    border-radius: 10px; background: #fff; padding: 5px;
  }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-8px,4px); } 40% { transform: translate(8px,-4px); }
    60% { transform: translate(-6px,-3px); } 80% { transform: translate(6px,3px); }
  }
  #busted.shake { animation: shake .35s linear; }
  @media (prefers-reduced-motion: reduce) {
    #bustedWord .l.stamp { animation-duration: .01s; }
    #busted.shake { animation: none; }
  }
</style>
</head>
<body>
<div id="app">
  <h1>YANIV <span>počítadlo</span></h1>

  <div id="addForm">
    <input id="newName" placeholder="Jméno hráče" autocomplete="off" maxlength="16" enterkeyhint="done">
    <button type="button" id="addBtn">+</button>
  </div>

  <div id="players"></div>
  <div id="msg"></div>

  <p class="hint" id="hintEl">
    Přidej hráče. Každé kolo zapiš všem hodnotu karet v ruce,
    volajícímu označ <b>Yaniv</b> — když ho někdo přebil, označ mu <b>Asaf</b>
    (volající pak dostane ruku +30). Přesných 50 se snižuje na 25.
    Kdo dosáhne 100, je BUSTED.
  </p>

  <button class="primary" id="saveRound">Zapsat kolo</button>
  <div class="row">
    <button class="secondary" id="undo">↩ Vrátit kolo</button>
    <button class="secondary" id="reset">Nová hra</button>
  </div>
  <div class="limitRow">
    <label for="limitInput">Hraje se do</label>
    <input id="limitInput" type="number" inputmode="numeric" step="10" min="20" max="1000">
    <span class="limitNote">jde změnit jen před prvním kolem</span>
  </div>

  <div id="historyBox" hidden>
    <h2>Historie kol</h2>
    <div class="tableWrap"><table id="history"></table></div>
  </div>
</div>

<div id="busted">
  <canvas id="chase" width="460" height="200"></canvas>
  <div id="bustedWord"></div>
  <div id="bustedWho"></div>
  <button id="bustedClose">OK</button>
  <a id="coffee" target="_blank" rel="noopener">☕ Buy me a coffee</a>

<script>
const BUSTED_TEXT = 'BUSTED, VOLE, BUSTED';
const COFFEE_URL = 'https://revolut.me/filipl0w2';

/* localStorage může být v sandboxu (Artifact/iframe) zablokovaný — pak jen v paměti */
const store = {
  get() { try { return localStorage.getItem('yaniv'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem('yaniv', v); } catch (e) {} }
};
let state = { players: [], rounds: [], limit: 100 };
try { state = Object.assign({ players: [], rounds: [], limit: 100 }, JSON.parse(store.get() || 'null')); } catch (e) {}
/* migrace starého formátu kola {pid: body} -> {s: {...}, y: null, a: null} */
state.rounds = state.rounds.map(r => r.s ? r : { s: r, y: null, a: null });
const LIMIT = () => state.limit;

const save = () => store.set(JSON.stringify(state));
const $ = id => document.getElementById(id);

let yanivSel = null, asafSel = null;   // výběr pro právě zapisované kolo

/* Přehraje celou hru od začátku: součty, halvace 50->25, kdo a kdy vypadl.
   Vrací totals {pid: body} a rows — data pro tabulku historie. */
function computeGame() {
  const totals = {};
  state.players.forEach(p => totals[p.id] = 0);
  const rows = [];
  const half = Math.round(LIMIT() / 2), quarter = Math.round(LIMIT() / 4);
  for (const r of state.rounds) {
    const row = {};
    for (const p of state.players) {
      if (totals[p.id] >= LIMIT()) { row[p.id] = null; continue; } // už je venku
      let sc = r.s[p.id] || 0;
      let badge = '';
      if (r.y === p.id) {
        if (r.a) { sc = (r.s[p.id] || 0) + 30; badge = 'yx'; }      // přebitý Yaniv: ruka +30
        else { sc = 0; badge = 'y'; }                               // úspěšný Yaniv: 0
      } else if (r.a === p.id) badge = 'a';
      totals[p.id] += sc;
      let slash = null;
      if (totals[p.id] === half) { totals[p.id] = quarter; slash = `${half}→${quarter}`; }
      row[p.id] = { sc, badge, slash };
    }
    rows.push(row);
  }
  return { totals, rows };
}

function render() {
  const { totals, rows } = computeGame();
  const box = $('players');
  box.innerHTML = '';
  for (const p of state.players) {
    const total = totals[p.id];
    const out = total >= LIMIT();
    const div = document.createElement('div');
    div.className = 'player' + (out ? ' out' : '');
    div.innerHTML = `
      <div class="name">${p.name.replace(/[<>&]/g, '')}</div>
      <div class="total ${total >= LIMIT() ? 'dead' : total >= LIMIT() * .8 ? 'warn' : ''}">${total}</div>
      ${out ? '<div class="outLabel">BUSTED</div>' : `
        <input type="number" inputmode="numeric" placeholder="0" data-id="${p.id}">
        <button type="button" class="chip chipY" data-id="${p.id}">Yaniv</button>
        <button type="button" class="chip chipA" data-id="${p.id}">Asaf</button>`}
    `;
    box.appendChild(div);
  }
  refreshChips();
  renderTable(rows, totals);
  $('saveRound').disabled = state.players.filter(p => totals[p.id] < LIMIT()).length === 0;
  $('undo').disabled = state.rounds.length === 0;
  $('hintEl').style.display = state.players.length ? 'none' : '';
  const half = Math.round(LIMIT() / 2), quarter = Math.round(LIMIT() / 4);
  $('hintEl').innerHTML = `Přidej hráče. Každé kolo zapiš všem hodnotu karet v ruce,
    volajícímu označ <b>Yaniv</b> — když ho někdo přebil, označ mu <b>Asaf</b>
    (volající pak dostane ruku +30). Přesných ${half} se snižuje na ${quarter}.
    Kdo dosáhne ${LIMIT()}, je BUSTED.`;
  $('limitInput').value = LIMIT();
  $('limitInput').disabled = state.rounds.length > 0;
}

function renderTable(rows, totals) {
  const boxWrap = $('historyBox');
  if (!state.rounds.length) { boxWrap.hidden = true; return; }
  boxWrap.hidden = false;
  const t = $('history');
  const names = state.players.map(p => `<th>${p.name.replace(/[<>&]/g, '')}</th>`).join('');
  const badgeHtml = b =>
    b === 'y' ? '<span class="badge y">Y</span>' :
    b === 'yx' ? '<span class="badge yx">Y+30</span>' :
    b === 'a' ? '<span class="badge a">A</span>' : '';
  const body = rows.map((row, i) => {
    const cells = state.players.map(p => {
      const c = row[p.id];
      if (!c) return '<td>–</td>';
      return `<td>${c.sc}${badgeHtml(c.badge)}${c.slash ? `<span class="slash">${c.slash}</span>` : ''}</td>`;
    }).join('');
    return `<tr><td>${i + 1}</td>${cells}</tr>`;
  }).join('');
  const foot = state.players.map(p =>
    `<td class="${totals[p.id] >= LIMIT() ? 'dead' : ''}">${totals[p.id] >= LIMIT() ? 'BUSTED' : totals[p.id]}</td>`
  ).join('');
  t.innerHTML = `
    <thead><tr><th>#</th>${names}</tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td>Σ</td>${foot}</tr></tfoot>`;
}

function refreshChips() {
  document.querySelectorAll('.chipY').forEach(b => b.classList.toggle('on', b.dataset.id === yanivSel));
  document.querySelectorAll('.chipA').forEach(b => b.classList.toggle('on', b.dataset.id === asafSel));
}

function setMsg(text) {
  $('msg').textContent = text || '';
  if (text) setTimeout(() => { if ($('msg').textContent === text) $('msg').textContent = ''; }, 4000);
}

function addPlayer() {
  const name = $('newName').value.trim();
  if (!name) return;
  state.players.push({ id: Date.now() + '' + Math.random().toString(36).slice(2, 6), name });
  $('newName').value = '';
  save(); render();
}
$('addBtn').addEventListener('click', addPlayer);
$('newName').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addPlayer(); }
});

/* Yaniv/Asaf výběr — delegace, ať přežije re-render a nesmaže zadané hodnoty */
$('players').addEventListener('click', e => {
  const y = e.target.closest('.chipY');
  const a = e.target.closest('.chipA');
  if (y) {
    yanivSel = yanivSel === y.dataset.id ? null : y.dataset.id;
    if (asafSel === yanivSel) asafSel = null;
  } else if (a) {
    asafSel = asafSel === a.dataset.id ? null : a.dataset.id;
    if (yanivSel === asafSel) yanivSel = null;
  } else return;
  refreshChips();
});

$('saveRound').addEventListener('click', () => {
  if (asafSel && !yanivSel) { setMsg('Asaf jde označit jen společně s Yanivem.'); return; }

  const s = {};
  let any = false;
  document.querySelectorAll('#players input').forEach(inp => {
    const v = parseInt(inp.value, 10);
    if (!isNaN(v) && v !== 0) { s[inp.dataset.id] = v; any = true; }
  });
  if (!any && !yanivSel) { setMsg('Zapiš aspoň jednu hodnotu.'); return; }

  const before = computeGame().totals;
  state.rounds.push({ s, y: yanivSel, a: asafSel });
  yanivSel = null; asafSel = null;
  save(); render();

  const after = computeGame().totals;
  const justBusted = state.players.filter(p => before[p.id] < LIMIT() && after[p.id] >= LIMIT());
  if (justBusted.length) showBusted(justBusted.map(p => p.name));
});

$('undo').addEventListener('click', () => { state.rounds.pop(); save(); render(); });

$('coffee').href = COFFEE_URL;

$('limitInput').addEventListener('change', () => {
  if (state.rounds.length) return;
  let v = parseInt($('limitInput').value, 10);
  if (isNaN(v)) v = 100;
  state.limit = Math.min(1000, Math.max(20, v));
  save(); render();
});

/* confirm() bývá v sandboxu blokovaný — potvrzení dvojím ťuknutím */
let resetArmed = null;
$('reset').addEventListener('click', () => {
  if (resetArmed) {
    clearTimeout(resetArmed); resetArmed = null;
    $('reset').textContent = 'Nová hra';
    state.rounds = [];
    yanivSel = null; asafSel = null;
    save(); render();
    return;
  }
  $('reset').textContent = 'Opravdu vynulovat?';
  resetArmed = setTimeout(() => {
    resetArmed = null;
    $('reset').textContent = 'Nová hra';
  }, 3000);
});

/* ================= BUSTED sekvence =================
   1. honička: CJ na Sanchezi ujíždí, policajt ho dojede a odstaví
   2. razítkování textu "BUSTED, VOLE, BUSTED" (SA styl)          */
const CHASE_MS = 3200;
let chaseRAF = null, chaseStart = 0;

function showBusted(names) {
  const overlay = $('busted');
  const word = $('bustedWord');
  word.innerHTML = '';
  $('bustedWho').textContent = names.join(' + ') + (names.length > 1 ? ' jsou' : ' je') + ` venku! (${LIMIT()}+)`;
  overlay.classList.add('show');
  document.body.classList.add('grayscale');
  if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 300]);

  startChase();
  playSound();

  /* písmena seskupená po slovech — řádek se láme jen mezi slovy */
  let delay = CHASE_MS + 850;
  for (const w of BUSTED_TEXT.split(' ')) {
    const wEl = document.createElement('span');
    wEl.className = 'word';
    for (const ch of w.split('')) {
      const l = document.createElement('span');
      l.className = 'l';
      l.textContent = ch;
      wEl.appendChild(l);
      const d = delay;
      setTimeout(() => {
        l.classList.add('stamp');
        overlay.classList.remove('shake');
        void overlay.offsetWidth;
        overlay.classList.add('shake');
      }, d);
      delay += 110;
    }
    word.appendChild(wEl);
  }
}

$('bustedClose').addEventListener('click', () => {
  $('busted').classList.remove('show');
  document.body.classList.remove('grayscale');
  if (chaseRAF) { cancelAnimationFrame(chaseRAF); chaseRAF = null; }
});

/* ---------- honička à la San Andreas (vlastní kresba, žádné herní assety) ----------
   Noční Los Santos: parallax skyline + palmy, CJ na Sanchezi, policejní
   Cruiser s majáky, smyk s prachem, reflektor a filmový flash. */
function startChase() {
  const cv = $('chase');
  const ctx = cv.getContext('2d');
  chaseStart = performance.now();
  if (chaseRAF) cancelAnimationFrame(chaseRAF);

  const W = cv.width, H = cv.height, GROUND = H - 30;
  const R = i => Math.abs(Math.sin(i * 999.77) * 43758.5453) % 1;   // deterministický "random"

  // hvězdy, budovy a palmy vygenerované jednou (žádné problikávání)
  const stars = Array.from({ length: 46 }, (_, i) =>
    ({ x: R(i) * W, y: R(i + 50) * (GROUND - 110), s: R(i + 99) < .25 ? 2 : 1 }));
  const bld = []; let bx = 0;
  while (bx < W * 2.2) {
    const w = 30 + R(bx) * 46, h = 42 + R(bx + 7) * 78;
    bld.push({ x: bx, w, h }); bx += w + 4 + R(bx + 13) * 18;
  }
  const BLD_W = bx;
  const palmGap = 190;

  function wheel(x, y, r, spin) {
    ctx.fillStyle = '#26292f';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#4a4f57'; ctx.lineWidth = 2.5;                // knobby plášť
    ctx.setLineDash([3, 4]); ctx.lineDashOffset = -spin * r;
    ctx.beginPath(); ctx.arc(x, y, r - 1.5, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#606774';
    ctx.beginPath(); ctx.arc(x, y, r * .38, 0, 7); ctx.fill();
    ctx.strokeStyle = '#9aa2ad'; ctx.lineWidth = 1.5;                // rotující výplet
    for (let k = 0; k < 3; k++) {
      const a = spin + k * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(x - Math.cos(a) * r * .72, y - Math.sin(a) * r * .72);
      ctx.lineTo(x + Math.cos(a) * r * .72, y + Math.sin(a) * r * .72);
      ctx.stroke();
    }
  }

  // Sanchez + jezdec (bílé tílko, džíny, zelený šátek); caught = ruce nad hlavu
  function drawBike(x, y, t, caught) {
    const spin = t / 40;
    wheel(x, y, 13, spin); wheel(x + 52, y, 13, spin);
    ctx.strokeStyle = '#4a4f57'; ctx.lineWidth = 3;                  // kyvná vidlice
    ctx.beginPath(); ctx.moveTo(x + 1, y - 2); ctx.lineTo(x + 24, y - 15); ctx.stroke();
    ctx.fillStyle = '#8d939c'; ctx.fillRect(x + 4, y - 21, 22, 4);   // výfuk
    ctx.fillStyle = '#c62828';                                       // rám + nádrž
    ctx.fillRect(x + 16, y - 31, 28, 9);
    ctx.fillRect(x + 32, y - 36, 14, 7);
    ctx.fillStyle = '#1b1b1b'; ctx.fillRect(x + 14, y - 34, 16, 4);  // sedlo
    ctx.fillStyle = '#f4f4f4';                                       // blatníky
    ctx.fillRect(x - 9, y - 27, 19, 4);
    ctx.fillRect(x + 43, y - 32, 20, 4);
    ctx.strokeStyle = '#c9ced6'; ctx.lineWidth = 3.5;                // přední vidlice
    ctx.beginPath(); ctx.moveTo(x + 52, y - 2); ctx.lineTo(x + 59, y - 38); ctx.stroke();
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 3;                  // řídítka
    ctx.beginPath(); ctx.moveTo(x + 59, y - 38); ctx.lineTo(x + 50, y - 45); ctx.stroke();

    // jezdec
    ctx.fillStyle = '#1e40af';                                       // stehno + lýtko
    ctx.fillRect(x + 20, y - 32, 9, 13);
    ctx.fillRect(x + 20, y - 22, 7, 9);
    ctx.fillStyle = '#33251a'; ctx.fillRect(x + 18, y - 15, 11, 5);  // bota
    ctx.fillStyle = '#f5f5f5';                                       // tílko (v předklonu / vzpřímeně)
    ctx.beginPath();
    if (!caught) {
      ctx.moveTo(x + 18, y - 32); ctx.lineTo(x + 30, y - 32);
      ctx.lineTo(x + 41, y - 51); ctx.lineTo(x + 30, y - 53);
    } else {
      ctx.moveTo(x + 19, y - 32); ctx.lineTo(x + 31, y - 32);
      ctx.lineTo(x + 33, y - 55); ctx.lineTo(x + 21, y - 55);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#7b4a24'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    if (!caught) {                                                   // jedna paže k řídítkům
      ctx.beginPath(); ctx.moveTo(x + 36, y - 48); ctx.lineTo(x + 51, y - 43); ctx.stroke();
    } else {                                                         // obě ruce nad hlavu
      ctx.beginPath(); ctx.moveTo(x + 22, y - 52); ctx.lineTo(x + 16, y - 68); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 30, y - 52); ctx.lineTo(x + 36, y - 68); ctx.stroke();
      ctx.fillStyle = '#7b4a24';
      ctx.beginPath(); ctx.arc(x + 15, y - 70, 3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 37, y - 70, 3, 0, 7); ctx.fill();
    }
    ctx.lineCap = 'butt';
    const hx = caught ? x + 21 : x + 33;                             // hlava
    const hy = caught ? y - 67 : y - 62;
    ctx.fillStyle = '#7b4a24'; ctx.fillRect(hx, hy, 11, 12);
    ctx.fillStyle = '#2e7d32'; ctx.fillRect(hx - 1, hy - 3, 13, 5);  // šátek
    const flap = caught ? 0 : Math.sin(t / 55) * 2;                  // vlající cíp
    ctx.fillRect(hx - 6, hy - 1 + flap, 6, 3);
  }

  // černobílý policejní cruiser
  function drawCop(x, y, t, caught) {
    const spin = t / 40;
    ctx.fillStyle = '#0c0c0e';                                       // kapota + kufr
    ctx.fillRect(x, y - 26, 27, 13);
    ctx.fillRect(x + 63, y - 26, 33, 13);
    ctx.beginPath();                                                 // zkosený předek
    ctx.moveTo(x + 96, y - 26); ctx.lineTo(x + 102, y - 18); ctx.lineTo(x + 96, y - 13);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ececec'; ctx.fillRect(x + 25, y - 27, 40, 14); // bílé dveře
    ctx.fillStyle = '#ececec';                                       // kabina
    ctx.beginPath();
    ctx.moveTo(x + 27, y - 27); ctx.lineTo(x + 35, y - 42); ctx.lineTo(x + 62, y - 42);
    ctx.lineTo(x + 68, y - 27); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9fc3e8';                                       // okna
    ctx.beginPath();
    ctx.moveTo(x + 31, y - 29); ctx.lineTo(x + 37, y - 40); ctx.lineTo(x + 47, y - 40);
    ctx.lineTo(x + 47, y - 29); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 50, y - 40); ctx.lineTo(x + 60, y - 40); ctx.lineTo(x + 64, y - 29);
    ctx.lineTo(x + 50, y - 29); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#111'; ctx.font = 'bold 8px sans-serif';
    ctx.fillText('POLICIE', x + 30, y - 17);
    ctx.fillStyle = '#ffd970'; ctx.fillRect(x + 99, y - 24, 3, 4);   // světlomet
    // maják — střídavé blikání + záře
    const phase = Math.floor(t / 110) % 2;
    const lit = phase === 0 ? '#ff2a2a' : '#2a6bff';
    ctx.fillStyle = phase === 0 ? '#ff2a2a' : '#5c0f0f';
    ctx.fillRect(x + 38, y - 48, 9, 6);
    ctx.fillStyle = phase === 1 ? '#2a6bff' : '#0f1f5c';
    ctx.fillRect(x + 49, y - 48, 9, 6);
    const g = ctx.createRadialGradient(x + 48, y - 45, 2, x + 48, y - 45, 30);
    g.addColorStop(0, lit + '55'); g.addColorStop(1, lit + '00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x + 48, y - 45, 30, 0, 7); ctx.fill();
    if (!caught) {                                                   // kužel světlometů
      ctx.fillStyle = 'rgba(255,244,190,.08)';
      ctx.beginPath();
      ctx.moveTo(x + 101, y - 21); ctx.lineTo(x + 160, y - 4); ctx.lineTo(x + 160, y - 32);
      ctx.closePath(); ctx.fill();
    }
    wheel(x + 19, y, 11, spin); wheel(x + 76, y, 11, spin);
  }

  function drawPalm(x, baseY, i) {
    ctx.strokeStyle = '#3d2f22'; ctx.lineWidth = 5;
    const lean = (R(i) - .5) * 14;
    ctx.beginPath(); ctx.moveTo(x, baseY);
    ctx.quadraticCurveTo(x + lean, baseY - 30, x + lean * 1.6, baseY - 56);
    ctx.stroke();
    const tx = x + lean * 1.6, ty = baseY - 56;
    ctx.strokeStyle = '#173b1f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let k = 0; k < 6; k++) {
      const a = -Math.PI * (0.12 + k * 0.15);
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + Math.cos(a) * 16, ty + Math.sin(a) * 16 - 4,
                           tx + Math.cos(a) * 30, ty + Math.sin(a) * 30 + 6);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  function frame(now) {
    const t = now - chaseStart;
    const p = Math.min(t / CHASE_MS, 1);
    const caught = p >= 1;
    const dist = 1500 * (1 - (1 - p) * (1 - p));                    // svět zpomaluje do zastavení
    const skid = p > .82 && !caught;

    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (skid) ctx.translate(Math.sin(t / 13) * 2, Math.cos(t / 17) * 1.5);

    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);          // noční obloha
    sky.addColorStop(0, '#060a18'); sky.addColorStop(1, '#1a2340');
    ctx.fillStyle = sky; ctx.fillRect(-4, -4, W + 8, GROUND + 8);

    ctx.fillStyle = '#f4f0d8';                                       // měsíc
    ctx.beginPath(); ctx.arc(W - 64, 34, 13, 0, 7); ctx.fill();
    const mg = ctx.createRadialGradient(W - 64, 34, 13, W - 64, 34, 42);
    mg.addColorStop(0, 'rgba(244,240,216,.25)'); mg.addColorStop(1, 'rgba(244,240,216,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(W - 64, 34, 42, 0, 7); ctx.fill();

    for (const s of stars) {                                         // hvězdy
      ctx.fillStyle = `rgba(255,255,255,${.4 + .4 * Math.sin(t / 300 + s.x)})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    const o1 = -(dist * .18) % BLD_W;                                // skyline (pomalý parallax)
    ctx.fillStyle = '#0e1424';
    for (const off of [o1, o1 + BLD_W]) for (const b of bld) {
      const x = b.x + off; if (x > W || x + b.w < 0) continue;
      ctx.fillRect(x, GROUND - b.h, b.w, b.h);
    }
    ctx.fillStyle = 'rgba(255,217,112,.5)';                          // svítící okna
    for (const off of [o1, o1 + BLD_W]) for (const b of bld) {
      const x = b.x + off; if (x > W || x + b.w < 0) continue;
      for (let k = 0; k < 5; k++) {
        if (R(b.x + k * 31) < .5) continue;
        ctx.fillRect(x + 4 + R(b.x + k) * (b.w - 9), GROUND - b.h + 6 + R(b.x + k + 3) * (b.h - 14), 3, 4);
      }
    }

    const o2 = -(dist * .6) % palmGap;                               // palmy (rychlejší parallax)
    for (let k = -1; k < W / palmGap + 2; k++) {
      const px = k * palmGap + o2 + R(k) * 40;
      drawPalm(px, GROUND + 2, Math.floor((px - o2) / palmGap));
    }

    ctx.fillStyle = '#15171c'; ctx.fillRect(-4, GROUND + 2, W + 8, H - GROUND);  // asfalt
    ctx.fillStyle = '#2c3038'; ctx.fillRect(-4, GROUND + 2, W + 8, 2);
    ctx.fillStyle = '#b9bec7';                                       // středová čára
    for (let k = 0; k < 10; k++) ctx.fillRect((k * 64 - dist % 64), GROUND + 15, 34, 3);

    if (t > 350) {                                                   // ambientní nádech majáků
      const phase = Math.floor(t / 110) % 2;
      ctx.fillStyle = phase === 0 ? 'rgba(255,42,42,.045)' : 'rgba(42,107,255,.045)';
      ctx.fillRect(-4, -4, W + 8, H + 8);
    }

    const s = 1 - Math.pow(1 - p, 3);                                // ease-out: rychlý nástup, plynulý dojezd
    const bikeX = -95 + s * (W * .62 + 95);
    const gap = 118 - 28 * s;
    const bounce = caught ? 0 : Math.sin(t / 45) * 2 * (1 - p * .7);

    if (skid || caught) {                                            // prach od smyku
      const d = caught ? 1 : (p - .82) / .18;
      ctx.fillStyle = `rgba(160,150,130,${.25 * (caught ? Math.max(0, 1 - (t - CHASE_MS) / 900) : d)})`;
      for (let k = 0; k < 5; k++) {
        ctx.beginPath();
        ctx.arc(bikeX - 6 - k * 13 - d * 8, GROUND + 6 - R(k) * 10 - k * 2, 5 + k * 2.6, 0, 7);
        ctx.fill();
      }
    }

    drawCop(bikeX - gap - 102, GROUND + (caught ? 0 : Math.sin(t / 60) * 1.4), t, caught);
    drawBike(bikeX, GROUND + bounce, caught ? 0 : t, caught);

    if (caught) {                                                    // policejní reflektor
      const a = .12 + .04 * Math.sin(t / 90);
      ctx.fillStyle = `rgba(255,250,214,${a})`;
      ctx.beginPath();
      ctx.moveTo(bikeX + 130, -10);
      ctx.lineTo(bikeX - 34, GROUND + 12); ctx.lineTo(bikeX + 92, GROUND + 12);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = `rgba(255,250,214,${a * .8})`;
      ctx.beginPath();
      ctx.ellipse(bikeX + 28, GROUND + 10, 66, 9, 0, 0, 7); ctx.fill();
    }

    ctx.restore();

    const f = 1 - (t - CHASE_MS) / 240;                              // flash při dopadení
    if (caught && f > 0) {
      ctx.fillStyle = `rgba(255,255,255,${f * .55})`;
      ctx.fillRect(0, 0, W, H);
    }

    const vg = ctx.createRadialGradient(W / 2, H * .5, H * .45, W / 2, H * .5, W * .72);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);                    // vinětace

    if ($('busted').classList.contains('show')) chaseRAF = requestAnimationFrame(frame);
  }
  chaseRAF = requestAnimationFrame(frame);
}

/* ---------- zvuk ----------
   Zkusí busted.mp3 (vlastní soubor vedle index.html), jinak syntéza:
   policejní siréna během honičky + orchestrální údery à la San Andreas. */
function playSound() {
  const mp3 = new Audio('busted.mp3');
  mp3.addEventListener('error', synthBusted, { once: true });
  mp3.play().catch(() => {});
}

function synthBusted() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const t0 = ctx.currentTime;
  const end = t0 + CHASE_MS / 1000;

  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  // motor Sancheze — hluboké vrčení s otáčkami
  const eng = ctx.createOscillator(); eng.type = 'sawtooth';
  eng.frequency.setValueAtTime(55, t0);
  eng.frequency.linearRampToValueAtTime(95, end - 0.7);
  eng.frequency.linearRampToValueAtTime(35, end);
  const engF = ctx.createBiquadFilter(); engF.type = 'lowpass'; engF.frequency.value = 240;
  const engG = ctx.createGain();
  engG.gain.setValueAtTime(0.10, t0);
  engG.gain.setValueAtTime(0.10, end - 0.6);
  engG.gain.linearRampToValueAtTime(0.0001, end);
  eng.connect(engF).connect(engG).connect(ctx.destination);
  eng.start(t0); eng.stop(end);

  // policejní wail — plynulé houkání nahoru a dolů
  const sir = ctx.createOscillator(); sir.type = 'sine';
  const sirEnd = end + 0.35;
  for (let x = 0; x < (sirEnd - t0); x += 1.1) {
    sir.frequency.setValueAtTime(620, t0 + x);
    sir.frequency.linearRampToValueAtTime(1180, t0 + x + 0.55);
    sir.frequency.linearRampToValueAtTime(620, t0 + x + 1.1);
  }
  const sirG = ctx.createGain();
  sirG.gain.setValueAtTime(0.0, t0);
  sirG.gain.linearRampToValueAtTime(0.085, t0 + 0.5);
  sirG.gain.setValueAtTime(0.085, end - 0.2);
  sirG.gain.linearRampToValueAtTime(0.0001, sirEnd);
  sir.connect(sirG).connect(ctx.destination);
  sir.start(t0); sir.stop(sirEnd);

  // smyk — filtrovaný šum těsně před zastavením
  const sk = ctx.createBufferSource(); sk.buffer = noiseBuf;
  const skF = ctx.createBiquadFilter(); skF.type = 'bandpass'; skF.frequency.value = 950; skF.Q.value = 0.9;
  const skG = ctx.createGain();
  const skT = end - 0.55;
  skG.gain.setValueAtTime(0.0, skT);
  skG.gain.linearRampToValueAtTime(0.28, skT + 0.06);
  skG.gain.exponentialRampToValueAtTime(0.001, skT + 0.55);
  sk.connect(skF).connect(skG).connect(ctx.destination);
  sk.start(skT); sk.stop(skT + 0.6);

  // orchestrální sting à la SA — dva těžké údery (tympán + žestě)
  [[0.06, 1], [0.42, 0.8]].forEach(([dt, vol]) => {
    const t = end + dt;
    const tym = ctx.createOscillator(); tym.type = 'sine';
    tym.frequency.setValueAtTime(82, t);
    tym.frequency.exponentialRampToValueAtTime(38, t + 0.5);
    const tymG = ctx.createGain();
    tymG.gain.setValueAtTime(0.85 * vol, t);
    tymG.gain.exponentialRampToValueAtTime(0.001, t + 0.62);
    tym.connect(tymG).connect(ctx.destination);
    tym.start(t); tym.stop(t + 0.65);

    const th = ctx.createBufferSource(); th.buffer = noiseBuf;       // "kůže" bubnu
    const thF = ctx.createBiquadFilter(); thF.type = 'lowpass'; thF.frequency.value = 160;
    const thG = ctx.createGain();
    thG.gain.setValueAtTime(0.5 * vol, t);
    thG.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    th.connect(thF).connect(thG).connect(ctx.destination);
    th.start(t); th.stop(t + 0.15);

    [98, 147, 196].forEach(f => {                                    // žesťový akord
      const br = ctx.createOscillator(); br.type = 'sawtooth';
      br.frequency.setValueAtTime(f, t);
      br.frequency.linearRampToValueAtTime(f * 0.985, t + 0.4);
      const brG = ctx.createGain();
      brG.gain.setValueAtTime(0.11 * vol, t);
      brG.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      br.connect(brG).connect(ctx.destination);
      br.start(t); br.stop(t + 0.55);
    });
  });

  // úder pro každé razítknuté písmeno
  const letters = BUSTED_TEXT.replace(/[^A-Z]/g, '').length;
  for (let i = 0; i < letters; i++) {
    const t = end + 0.85 + i * 0.11;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
    g.gain.setValueAtTime(0.22, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + 0.12);
  }
}

/* ---------- PWA: service worker (jen přes http/https, na file:// se přeskočí) ---------- */
try {
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) {}

render();
</script>
